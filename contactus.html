<!DOCTYPE html>
<html lang="en">
<head>

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Send us a message below.</p>
        </div>

        <div class="content">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <p style="color: var(--text-muted);">Have questions or feedback? Fill out the form or reach us via contact details.</p>

                <div class="info-item">
                    <div class="info-icon">📍</div>
                    <div class="info-text">
                        <h3>Address</h3>
                        <p>123 University Street, Aden, Yemen</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">📧</div>
                    <div class="info-text">
                        <h3>Email</h3>
                        <p>info@aden-uni.edu</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon"></div>
                    <div class="info-text">
                        <h3>Phone</h3>
                        <p>+967 2 123 4567</p>
                    </div>
                </div>
            </div>

            <form class="contact-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you for contacting us! We will get back to you soon.');">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Inquiry about training" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

</body>
</html>
